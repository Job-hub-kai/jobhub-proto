syntax = "proto3";

package notification.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Alksndr9/jobhub-proto/gen/go/notification";

service NotificationService {
  rpc GetNotifications(GetNotificationsRequest) returns (GetNotificationsResponse);
  rpc MarkAsRead(MarkAsReadRequest) returns (MarkAsReadResponse);
  rpc MarkAllAsRead(MarkAllAsReadRequest) returns (MarkAllAsReadResponse);
  rpc DeleteNotification(DeleteNotificationRequest) returns (DeleteNotificationResponse);
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
}

message Notification {
  string                    id         = 1;
  string                    user_id    = 2;
  string                    type       = 3;
  string                    title      = 4;
  string                    body       = 5;
  string                    job_id     = 6;
  bool                      is_read    = 7;
  google.protobuf.Timestamp created_at = 8;
}

message GetNotificationsRequest {
  string user_id     = 1;
  int32  page        = 2;
  int32  limit       = 3;
  bool   unread_only = 4;
}

message GetNotificationsResponse {
  repeated Notification notifications = 1;
  int64                 total         = 2;
  int64                 unread_count  = 3;
}

message MarkAsReadRequest {
  string user_id         = 1;
  string notification_id = 2;
}

message MarkAsReadResponse {}

message MarkAllAsReadRequest {
  string user_id = 1;
}

message MarkAllAsReadResponse {}

message DeleteNotificationRequest {
  string user_id         = 1;
  string notification_id = 2;
}

message DeleteNotificationResponse {}

message NotificationSettings {
  string user_id          = 1;
  bool   email_enabled    = 2;
  bool   telegram_enabled = 3;
  string telegram_chat_id = 4;
}

message GetSettingsRequest {
  string user_id = 1;
}

message GetSettingsResponse {
  NotificationSettings settings = 1;
}

message UpdateSettingsRequest {
  string user_id          = 1;
  bool   email_enabled    = 2;
  bool   telegram_enabled = 3;
  string telegram_chat_id = 4;
}

message UpdateSettingsResponse {
  NotificationSettings settings = 1;
}